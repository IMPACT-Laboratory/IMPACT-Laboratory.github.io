# site properties and page defaults
title: IMPACT Lab
show-title: false
subtitle: ""
description: "The IMPACT Lab at the University of South Florida, led by Prof. Zach Ayers"
logo: images/ImpactLabLogo2.png
header: images/PRDE_Hotfire.jpeg
footer: images/PRDE_Hotfire.jpeg
proofer: false

# site social media and other links
